# Build output lives entirely outside Dropbox (see build.gradle.kts and below).
# Project-level Gradle cache (.gradle) also redirected out of the repo.
org.gradle.projectcachedir=C:/NietoCity-build/.gradle

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Java toolchains: use locally installed JDKs only, never download one.
# :desktop needs a JDK 8 "Full" (BellSoft Liberica) for JavaFX 8.
org.gradle.java.installations.auto-download=false
